[project]
name = "food-security-agent"
version = "0.1.0"
description = "An agent that helps analysts explain why food insecurity is changing in a region by combining evidence from situation reports, conflict event data, and rainfall trends."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
